image:
  repository: ghcr.io/jobmatchme/bee-slack
  tag: "0.1.4"

config:
  create: true
  appToken: xapp-REPLACE_ME
  botToken: xoxb-REPLACE_ME
  nats:
    servers:
      - nats://nats.nats.svc.cluster.local:4222
    name: bee-slack
  routes:
    - id: dm-test
      match:
        dm: true
      worker:
        subject: bee.agent.test
      session:
        strategy: thread
        prefix: bee
    - id: mention-pilot
      match:
        channelIds:
          - C0123456789
      streaming:
        enabled: true
        taskDisplayMode: timeline
      threadContext:
        enabled: true
        maxMessages: 20
        maxChars: 12000
      worker:
        subject: bee.agent.test
      session:
        strategy: thread
        prefix: bee-pilot
